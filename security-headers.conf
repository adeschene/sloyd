# Security headers, included into the server block AND every location block that
# sets its own add_header.
#
# Why an include rather than one set at server level: nginx's add_header does not
# merge across levels. A location block containing ANY add_header discards every
# add_header inherited from its parent. Both /assets/ and =/index.html set
# Cache-Control, so server-level security headers would silently disappear on the
# two most-requested paths — headers present on a curl of / and absent on the JS
# bundle. Including this file everywhere is what makes them actually apply.
#
# `always` sends the header on error responses too, not just 2xx/3xx.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# Sloyd is entirely self-contained: no CDN, no analytics, no external fonts, and no
# network calls at all — the document lives in localStorage. So everything can be
# locked to 'self'.
#
# The two deliberate relaxations:
#   style-src 'unsafe-inline' — react-three-fiber sets inline styles on the canvas
#     wrapper element, and inline style attributes are blocked by style-src without
#     it. Style injection is a far weaker vector than script injection, and
#     script-src stays strict.
#   img-src/worker-src blob: — the favicon is a data: URI, and file export builds a
#     blob: URL for the download.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
