# Security headers, included into the server block AND every location block that
# sets its own add_header.
#
# Why an include rather than one set at server level: nginx's add_header does not
# merge across levels. A location block containing ANY add_header discards every
# add_header inherited from its parent. Both /assets/ and =/index.html set
# Cache-Control, so server-level security headers would silently disappear on the
# two most-requested paths — headers present on a curl of / and absent on the JS
# bundle. Including this file everywhere is what makes them actually apply.
#
# `always` sends the header on error responses too, not just 2xx/3xx.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# Sloyd itself is entirely self-contained: no CDN, no external fonts, and no network
# calls of its own — the document lives in localStorage. So the app's own needs are
# all 'self'.
#
# The one thing that is NOT the app: Cloudflare Web Analytics. Cloudflare injects
# its beacon into the HTML at the edge (only for browser-like requests — a plain
# curl does not see it, which is why this looked like it might be switched off),
# and `script-src 'self'` blocked it, so the site reported no analytics at all.
# Exactly ONE origin is needed:
#   script-src https://static.cloudflareinsights.com — the beacon script itself
#
# Deliberately NOT added: `connect-src https://cloudflareinsights.com`, which
# Cloudflare's generic CSP guidance tells you to include. It is unnecessary here
# and was verified so rather than assumed. The beacon picks its reporting URL as
#     p.send?.to ?? (p.version === undefined ? "https://cloudflareinsights.com/cdn-cgi/rum" : null)
# where `p` is the injected `data-cf-beacon` JSON. Ours carries a `version`
# ("2024.11.0") and no `send`, so that expression is null and the beacon POSTs
# SAME-ORIGIN to /cdn-cgi/rum, which Cloudflare intercepts at the edge — already
# covered by `connect-src 'self'`. Confirmed in a real browser: the POST goes to
# sloyd.oddbox.tech/cdn-cgi/rum and returns 204, with zero CSP violations. The
# apex URL is only used by legacy beacons that ship no `version`. If the beacon
# is ever downgraded to one of those, the POST will start failing and this is the
# line to change.
#
# This is a real trade-off, not a freebie: `static.cloudflareinsights.com` is the
# only third-party origin the page talks to, and it is why the paragraph above
# says "Sloyd itself" rather than "Sloyd". If analytics are ever turned off in the
# Cloudflare dashboard, delete the origin and this comment with it.
#
# The two deliberate relaxations:
#   style-src 'unsafe-inline' — react-three-fiber sets inline styles on the canvas
#     wrapper element, and inline style attributes are blocked by style-src without
#     it. Style injection is a far weaker vector than script injection, and
#     script-src stays strict.
#   img-src/worker-src blob: — the favicon is a data: URI, and file export builds a
#     blob: URL for the download.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
